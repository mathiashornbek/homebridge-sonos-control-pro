<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sonos Control Pro">
  <title>Sonos Control Pro</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#D2C0A2" />
      <stop offset="100%" stop-color="#BFAB88" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)" />

  <!--
    The mark is the plugin's idea in one shape: a switch, with sound coming out
    of it. Below it, the name of the system it controls — the word set in a
    plain grotesque and converted to outlines, not Sonos's logotype, which is
    theirs. Outlines rather than text so the icon renders identically wherever
    it is opened, with no font to find.
  -->
