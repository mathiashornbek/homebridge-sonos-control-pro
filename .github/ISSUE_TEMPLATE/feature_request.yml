name: Feature request
description: Something the plugin should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution — it often has a simpler answer.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it working
